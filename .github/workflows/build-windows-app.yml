name: Build Windows App

# The Windows app lives in windows/ and shares the Mac app's resources and version number.
# Every push builds and tests it; a version tag also attaches the Windows zips to that
# version's GitHub release (the same release as the Mac app).
on:
  push:
    branches:
      - main
      - windows
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        if: matrix.arch == 'x64'
        working-directory: windows
        run: dotnet test --project tests/GreSimulation.Core.Tests -c Release

      - name: Publish self-contained app
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pbx = Get-Content -Raw 'Gre Simulation.xcodeproj/project.pbxproj'
          $version = [regex]::Match($pbx, 'MARKETING_VERSION = ([0-9.]+);').Groups[1].Value
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $out = Join-Path $env:RUNNER_TEMP 'publish/Gre Simulation'
          dotnet publish windows/src/GreSimulation.App/GreSimulation.App.csproj `
            -c Release -r win-${{ matrix.arch }} -p:Platform=$platform -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'GreSimulation.exe', 'Resources/ExpandedQuestions.json', 'Resources/VerbalGuessingTips.json', 'Resources/WordPronunciations.pack') {
            if (-not (Test-Path (Join-Path $out $file))) { throw "Missing $file in the published app" }
          }
          $zipName = "Gre-Simulation-$version-Windows-${{ matrix.arch }}.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path $out -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "Gre-Simulation-$version-Windows-${{ matrix.arch }}-SHA256.txt")
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gre-Simulation-${{ steps.publish.outputs.version }}-Windows-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/*.zip
            ${{ runner.temp }}/*-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the version's release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The Mac release is published right after the tag is pushed; wait for it.
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag --repo '${{ github.repository }}' *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release $tag was not found." }
          gh release upload $tag --repo '${{ github.repository }}' --clobber `
            (Join-Path $env:RUNNER_TEMP '${{ steps.publish.outputs.zip }}') `
            (Get-ChildItem (Join-Path $env:RUNNER_TEMP '*-SHA256.txt')).FullName
